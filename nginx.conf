server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # RSS best practice: stable, memorable feed URLs (301 to the real Hugo feed)
  rewrite ^/(feed|feed\.xml|rss\.xml|atom\.xml)/?$ /index.xml permanent;
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
